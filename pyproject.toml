[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DJCat-Pro-5"
version = "5.0.9"
description = "电教猫 Pro 5 - 基于 PySide6 和 Fluent Widgets 重构"
authors = [
    {name = "电教猫"}
]
requires-python = ">=3.12.8,<3.13"
dependencies = [
    "PySide6==6.10.0",
    "PySide6-Fluent-Widgets==1.11.3",
    "requests>=2.28.0",
    "loguru",
    "markdown-it-py~=3.0",
    "linkify-it-py~=2.0",
    "pygments~=2.18",
    "emoji~=2.14",
    "nuitka",
    "imageio",
    "edge-tts==7.2.8"
]

[dependency-groups]
dev = [
    "cryptography==46.0.3",
    "Flask>=3.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*", "pyqt_github_markdown*"]
