name: Inspect latest release run

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/inspect-release-latest.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture recent release runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=push&per_page=20")
          summary=$(printf '%s' "$runs" | jq '{workflow_runs: [.workflow_runs[] | {id, name, status, conclusion, head_sha, run_number, run_attempt, created_at, updated_at, html_url}] }')
          content=$(printf '%s\n' "$summary" | base64 -w0)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.ci/release-runs-${GITHUB_RUN_ID}.json" \
            -f message="ci: capture latest release runs" \
            -f content="$content" \
            -f branch="$GITHUB_REF_NAME"
          # refresh after ARM64 lock verification
