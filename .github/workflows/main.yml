name: Build and Release DJCat Pro

on:
  push:
    branches: [ main ]
    paths:
      - app/common/config.py
      - .github/release-notes/**
      - .github/workflows/main.yml
      - scripts/DJCat-Pro-5.iss
      - scripts/verify_pe_arch.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djcat-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: 1
  # windows-11-arm ships this native ARM64 patch release in its tool cache.
  PYTHON_VERSION: 3.12.10

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      notes_file: ${{ steps.release.outputs.notes_file }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("app/common/config.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("VERSION was not found in app/common/config.py")
          print(match.group(1))
          PY
          )
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          test -f "$NOTES_FILE" || {
            echo "Missing release notes: $NOTES_FILE" >&2
            exit 1
          }

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag $TAG already exists; release assets are immutable. Bump VERSION before publishing again." >&2
            exit 1
          fi
          SOURCE_SHA="${GITHUB_SHA}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Record prepare failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '%s\n' \
            'job=prepare' \
            'checkout=${{ steps.checkout.outcome }}' \
            'release=${{ steps.release.outcome }}')
          content=$(printf '%s' "$body" | base64 -w0)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.ci/release-${GITHUB_RUN_ID}-prepare.txt" \
            -f message="ci: record release diagnostics" \
            -f content="$content" \
            -f branch="$GITHUB_REF_NAME"

  test-windows:
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Upgrade pip
        id: upgrade_pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        id: install
        run: python -m pip install . --group dev

      - name: Run tests
        id: pytest
        run: python -m pytest -q

      - name: Compile Python sources
        id: compile
        run: python -m compileall -q app server tests

      - name: Check admin JavaScript
        id: node
        run: node --check server/static/admin.js

      - name: Record Windows test failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @(
            "job=test-windows",
            "checkout=${{ steps.checkout.outcome }}",
            "setup_python=${{ steps.setup_python.outcome }}",
            "upgrade_pip=${{ steps.upgrade_pip.outcome }}",
            "install=${{ steps.install.outcome }}",
            "pytest=${{ steps.pytest.outcome }}",
            "compile=${{ steps.compile.outcome }}",
            "node=${{ steps.node.outcome }}"
          ) -join "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/.ci/release-$env:GITHUB_RUN_ID-test-windows.txt" `
            -f "message=ci: record release diagnostics" `
            -f "content=$content" `
            -f "branch=$env:GITHUB_REF_NAME"

  build-windows:
    needs: [ prepare, test-windows ]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: windows-2022
            python_arch: x64
            inno_arch: x64compatible
          - architecture: arm64
            runner: windows-11-arm
            python_arch: arm64
            inno_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARCH: ${{ matrix.architecture }}
      INNO_ARCH: ${{ matrix.inno_arch }}
    steps:
      - name: Checkout release source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Verify runner architecture
        id: verify_runner
        shell: pwsh
        run: |
          $actual = python -c "import platform; print(platform.machine().lower())"
          $expected = if ($env:BUILD_ARCH -eq "arm64") { "arm64" } else { "amd64" }
          if ($actual.Trim() -ne $expected) {
            throw "Runner Python architecture is '$actual'; expected '$expected'."
          }

      - name: Upgrade pip
        id: upgrade_pip
        run: python -m pip install --upgrade pip

      - name: Install build dependencies
        id: install
        run: python -m pip install . --group dev

      - name: Test native ARM64 runtime
        id: arm_pytest
        if: matrix.architecture == 'arm64'
        run: python -m pytest -q

      - name: Compile native ARM64 sources
        id: arm_compile
        if: matrix.architecture == 'arm64'
        run: python -m compileall -q app server tests

      - name: Check native ARM64 admin JavaScript
        id: arm_node
        if: matrix.architecture == 'arm64'
        run: node --check server/static/admin.js

      - name: Build standalone application
        id: build
        run: python deploy.py

      - name: Verify executable architecture
        id: verify_exe
        run: python scripts/verify_pe_arch.py dist/djcat.dist/djcat.exe ${{ matrix.architecture }}

      - name: Build portable ZIP
        id: zip
        shell: pwsh
        run: |
          $zipFile = "DJCat-Pro-v$env:VERSION-Windows-$env:BUILD_ARCH.zip"
          7z a -tzip -mx=9 -m0=LZMA $zipFile ".\dist\djcat.dist\*"
          if (-not (Test-Path $zipFile)) {
            throw "Expected portable ZIP was not generated."
          }

      - name: Download installer language
        id: language
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl" `
            -OutFile "scripts\ChineseSimplified.isl"
          $languageHash = (Get-FileHash "scripts\ChineseSimplified.isl" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($languageHash -ne "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d") {
            throw "ChineseSimplified.isl checksum mismatch: $languageHash"
          }

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }

          $baseVersion = [regex]::Match($env:VERSION, '^\d+\.\d+\.\d+').Value
          $preNumber = [regex]::Match($env:VERSION, 'pre\.(\d+)$')
          $numericVersion = if ($preNumber.Success) {
            "$baseVersion.$($preNumber.Groups[1].Value)"
          } else {
            "$baseVersion.0"
          }

          & $iscc `
            "/DMyAppVersion=$env:VERSION" `
            "/DMyAppNumericVersion=$numericVersion" `
            "/DMyAppArch=$env:INNO_ARCH" `
            "/DMyAppArchName=$env:BUILD_ARCH" `
            "scripts\DJCat-Pro-5.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create installer checksum
        id: checksum
        shell: pwsh
        run: |
          $setupFile = "dist\DJCat-Pro-v$env:VERSION-Windows-$env:BUILD_ARCH-Setup.exe"
          if (-not (Test-Path $setupFile)) {
            throw "Expected installer was not generated."
          }
          $setupHash = (Get-FileHash $setupFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  $(Split-Path $setupFile -Leaf)" | Set-Content -Encoding ascii "$setupFile.sha256"

      - name: Upload architecture packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DJCat-Pro-v${{ env.VERSION }}-Windows-${{ matrix.architecture }}
          path: |
            DJCat-Pro-v${{ env.VERSION }}-Windows-${{ matrix.architecture }}.zip
            dist/DJCat-Pro-v${{ env.VERSION }}-Windows-${{ matrix.architecture }}-Setup.exe
            dist/DJCat-Pro-v${{ env.VERSION }}-Windows-${{ matrix.architecture }}-Setup.exe.sha256
          if-no-files-found: error

      - name: Record build failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @(
            "job=build-$env:BUILD_ARCH",
            "checkout=${{ steps.checkout.outcome }}",
            "setup_python=${{ steps.setup_python.outcome }}",
            "verify_runner=${{ steps.verify_runner.outcome }}",
            "upgrade_pip=${{ steps.upgrade_pip.outcome }}",
            "install=${{ steps.install.outcome }}",
            "arm_pytest=${{ steps.arm_pytest.outcome }}",
            "arm_compile=${{ steps.arm_compile.outcome }}",
            "arm_node=${{ steps.arm_node.outcome }}",
            "build=${{ steps.build.outcome }}",
            "verify_exe=${{ steps.verify_exe.outcome }}",
            "zip=${{ steps.zip.outcome }}",
            "language=${{ steps.language.outcome }}",
            "installer=${{ steps.installer.outcome }}",
            "checksum=${{ steps.checksum.outcome }}",
            "upload=${{ steps.upload.outcome }}"
          ) -join "`n"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/.ci/release-$env:GITHUB_RUN_ID-$env:BUILD_ARCH.txt" `
            -f "message=ci: record release diagnostics" `
            -f "content=$content" `
            -f "branch=$env:GITHUB_REF_NAME"

  publish-release:
    needs: [ prepare, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      NOTES_FILE: ${{ needs.prepare.outputs.notes_file }}
    steps:
      - name: Checkout release source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download release packages
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: DJCat-Pro-*
          path: release-assets
          merge-multiple: true

      - name: Validate release packages
        id: validate
        shell: bash
        run: |
          rm -rf release-files
          mkdir release-files
          expected=(
            "DJCat-Pro-${TAG}-Windows-x86_64.zip"
            "DJCat-Pro-${TAG}-Windows-x86_64-Setup.exe"
            "DJCat-Pro-${TAG}-Windows-x86_64-Setup.exe.sha256"
            "DJCat-Pro-${TAG}-Windows-arm64.zip"
            "DJCat-Pro-${TAG}-Windows-arm64-Setup.exe"
            "DJCat-Pro-${TAG}-Windows-arm64-Setup.exe.sha256"
          )
          for file in "${expected[@]}"; do
            mapfile -t matches < <(find release-assets -type f -name "$file")
            test "${#matches[@]}" -eq 1 || {
              echo "Expected exactly one release asset named $file; found ${#matches[@]}." >&2
              exit 1
            }
            test -s "${matches[0]}" || {
              echo "Release asset is empty: ${matches[0]}" >&2
              exit 1
            }
            cp "${matches[0]}" "release-files/$file"
          done
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 6
          (cd release-files && sha256sum -c -- *-Setup.exe.sha256)

      - name: Create release
        id: release
        shell: bash
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release-files/* \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            "${release_args[@]}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Record publish failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          body=$(printf '%s\n' \
            'job=publish-release' \
            'checkout=${{ steps.checkout.outcome }}' \
            'download=${{ steps.download.outcome }}' \
            'validate=${{ steps.validate.outcome }}' \
            'release=${{ steps.release.outcome }}')
          content=$(printf '%s' "$body" | base64 -w0)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.ci/release-${GITHUB_RUN_ID}-publish.txt" \
            -f message="ci: record release diagnostics" \
            -f content="$content" \
            -f branch="$GITHUB_REF_NAME"
