name: Build and Release DJCat Pro

on:
  push:
    branches: [ main ]
    paths:
      - app/common/config.py
      - pyproject.toml
      - uv.lock
      - .github/release-notes/**
      - .github/workflows/main.yml
      - scripts/DJCat-Pro-5.iss
      - scripts/verify_pe_arch.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djcat-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  PYTHON_VERSION: 3.12.10

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      notes_file: ${{ steps.release.outputs.notes_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("app/common/config.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("VERSION was not found in app/common/config.py")
          print(match.group(1))
          PY
          )
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          test -f "$NOTES_FILE" || {
            echo "Missing release notes: $NOTES_FILE" >&2
            exit 1
          }
          TITLE=$(python - "$NOTES_FILE" "$TAG" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(
              r"^<!--\s*release-title:\s*(.+?)\s*-->$",
              text,
              re.MULTILINE,
          )
          print(match.group(1) if match else sys.argv[2])
          PY
          )

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [[ "$(git log -1 --format=%s)" != "release: republish $TAG" ]]; then
              echo "Release tag $TAG already exists; use an explicit republish commit or bump VERSION." >&2
              exit 1
            fi
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
          SOURCE_SHA="${GITHUB_SHA}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

  test-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install and test
        shell: pwsh
        run: |
          uv sync --frozen
          uv run --frozen python -m pytest -q
          uv run --frozen python -m compileall -q app server tests
          node --check server/static/admin.js

  build-windows:
    needs: [ prepare, test-windows ]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARCH: x86_64
      INNO_ARCH: x64compatible
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Verify runner architecture
        shell: pwsh
        run: |
          $actual = python -c "import platform; print(platform.machine().lower())"
          if ($actual.Trim() -ne "amd64") {
            throw "Runner Python architecture is '$actual'; expected 'amd64'."
          }

      - name: Install build dependencies
        run: uv sync --frozen

      - name: Build standalone application
        run: uv run --frozen python deploy.py

      - name: Verify executable architecture
        run: uv run --frozen python scripts/verify_pe_arch.py dist/djcat.dist/djcat.exe x86_64

      - name: Build portable ZIP and installer
        shell: pwsh
        run: |
          $zipFile = "DJCat-Pro-v$env:VERSION-Windows-$env:BUILD_ARCH.zip"
          7z a -tzip -mx=9 -m0=LZMA $zipFile ".\dist\djcat.dist\*"

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl" `
            -OutFile "scripts\ChineseSimplified.isl"
          $languageHash = (Get-FileHash "scripts\ChineseSimplified.isl" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($languageHash -ne "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d") {
            throw "ChineseSimplified.isl checksum mismatch: $languageHash"
          }

          $baseVersion = [regex]::Match($env:VERSION, '^\d+\.\d+\.\d+').Value
          $preNumber = [regex]::Match($env:VERSION, 'pre\.(\d+)$')
          $numericVersion = if ($preNumber.Success) {
            "$baseVersion.$($preNumber.Groups[1].Value)"
          } else {
            "$baseVersion.0"
          }

          & $iscc `
            "/DMyAppVersion=$env:VERSION" `
            "/DMyAppNumericVersion=$numericVersion" `
            "/DMyAppArch=$env:INNO_ARCH" `
            "/DMyAppArchName=$env:BUILD_ARCH" `
            "scripts\DJCat-Pro-5.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $setupFile = "dist\DJCat-Pro-v$env:VERSION-Windows-$env:BUILD_ARCH-Setup.exe"
          if (-not (Test-Path $zipFile) -or -not (Test-Path $setupFile)) {
            throw "Expected release package was not generated."
          }
          $setupHash = (Get-FileHash $setupFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  $(Split-Path $setupFile -Leaf)" | Set-Content -Encoding ascii "$setupFile.sha256"

      - name: Upload x86_64 packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DJCat-Pro-v${{ env.VERSION }}-Windows-x86_64
          path: |
            DJCat-Pro-v${{ env.VERSION }}-Windows-x86_64.zip
            dist/DJCat-Pro-v${{ env.VERSION }}-Windows-x86_64-Setup.exe
            dist/DJCat-Pro-v${{ env.VERSION }}-Windows-x86_64-Setup.exe.sha256
          if-no-files-found: error

  publish-release:
    needs: [ prepare, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      NOTES_FILE: ${{ needs.prepare.outputs.notes_file }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: DJCat-Pro-*
          path: release-assets
          merge-multiple: true

      - name: Validate release packages
        shell: bash
        run: |
          rm -rf release-files
          mkdir release-files
          expected=(
            "DJCat-Pro-${TAG}-Windows-x86_64.zip"
            "DJCat-Pro-${TAG}-Windows-x86_64-Setup.exe"
            "DJCat-Pro-${TAG}-Windows-x86_64-Setup.exe.sha256"
          )
          for file in "${expected[@]}"; do
            mapfile -t matches < <(find release-assets -type f -name "$file")
            test "${#matches[@]}" -eq 1 || {
              echo "Expected exactly one release asset named $file; found ${#matches[@]}." >&2
              exit 1
            }
            test -s "${matches[0]}" || {
              echo "Release asset is empty: ${matches[0]}" >&2
              exit 1
            }
            cp "${matches[0]}" "release-files/$file"
          done
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 3
          (cd release-files && sha256sum -c -- *-Setup.exe.sha256)

      - name: Create release
        shell: bash
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release-files/* \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            "${release_args[@]}" \
            --repo "$GITHUB_REPOSITORY"
