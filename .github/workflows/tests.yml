name: Tests

# 发版流水线只在 main 上改动特定文件时才跑测试，平时的推送和 PR 没人把关，
# 失败的测试会一路攒到下次发版才炸出来。这里在每次推送和 PR 时跑同一套检查。
# 不要把这些步骤并进 main.yml：它本身就在发版的触发路径里，改它会触发一次发版。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: 1
  PYTHON_VERSION: 3.12.10

jobs:
  test-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install and test
        shell: pwsh
        run: |
          uv sync --frozen
          uv run --frozen python -m pytest -q
          uv run --frozen python -m compileall -q app server tests
          node --check server/static/admin.js

  build-updater:
    # 与发版时构建 updater.exe 的命令一致，让 MSVC 编译错误在合并前暴露，而不是在发版那一刻。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build updater with MSVC
        shell: pwsh
        run: |
          cmake -B build-updater -G "Visual Studio 17 2022" -A x64 tools/updater
          cmake --build build-updater --config Release
          if (-not (Test-Path build-updater/Release/updater.exe)) { throw "updater.exe was not built" }
