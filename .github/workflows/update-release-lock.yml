name: Update release lock

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/update-release-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: arm64

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"

      - name: Update and verify lock
        shell: pwsh
        run: |
          uv lock --upgrade-package cryptography
          uv sync --frozen
          uv run --frozen python -c "import cryptography, platform; print(cryptography.__version__); print(platform.machine())"

      - name: Commit lock
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) { throw "uv.lock did not change." }
          git commit -m "chore(release): 锁定 ARM64 cryptography 46.0.3"
          git push origin HEAD:main
