<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>电教猫管理面板</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-page">
    <div class="login-wrap">
        <header>
            <div class="nav">
                <span class="logo">电教猫<span>·</span>控制台</span>
                <span class="login-domain">dash.djcatpro.top</span>
            </div>
        </header>

        <main class="login-main">
            <section class="login-copy">
                <div class="eyebrow">Private control room</div>
                <h1>回到你的<br><em>管理面板<svg class="underline-draw" viewBox="0 0 220 14" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M2 9 C 55 3, 165 11, 218 5" /></svg></em>。</h1>
                <p>模型、额度和注册机器，都安静地放在这里。</p>
            </section>

            <section class="login-card">
                <div class="section-label">Administrator access</div>
                <h2>登录</h2>
                <p>使用服务端管理员凭据继续。</p>
                {% for category, message in get_flashed_messages(with_categories=true) %}
                    <div class="notice {{ category }}">{{ message }}</div>
                {% endfor %}
                <form method="post" action="{{ url_for('adminLogin') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <label>用户名
                        <input name="username" autocomplete="username" required autofocus>
                    </label>
                    <label>密码
                        <input type="password" name="password" autocomplete="current-password" required>
                    </label>
                    <button class="btn btn-primary wide" type="submit">进入管理面板</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
