<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 电教猫服务控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-visual" aria-label="电教猫服务控制台">
            <a class="brand login-brand" href="{{ url_for('adminLogin') }}">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span><strong>电教猫</strong><small>服务控制台</small></span>
            </a>
            <div class="login-copy">
                <div class="eyebrow">Private control room</div>
                <h1>管理服务，<br><em>保持清楚。</em></h1>
                <p>模型、额度、提示词和注册机器，都在一个安静的控制台里。</p>
            </div>
            <div class="login-detail">dash.djcatpro.top · Beijing time</div>
        </section>
        <section class="login-form-panel">
            <div class="login-card">
                <div class="eyebrow">Administrator access</div>
                <h2>登录</h2>
                <p>使用服务端管理员凭据继续。</p>
                {% for category, message in get_flashed_messages(with_categories=true) %}
                    <div class="notice {{ category }}">{{ message }}</div>
                {% endfor %}
                <form method="post" action="{{ url_for('adminLogin') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <label>用户名
                        <input name="username" autocomplete="username" required autofocus>
                    </label>
                    <label>密码
                        <input type="password" name="password" autocomplete="current-password" required>
                    </label>
                    <button class="button button-primary" type="submit">进入管理面板</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
