{% macro action_fields(action=None) %}
<label>动作类型
    <select name="action_type" required>
        <option value="program" {% if not action or action.type == 'program' %}selected{% endif %}>运行程序</option>
        <option value="url" {% if action and action.type == 'url' %}selected{% endif %}>打开网址</option>
    </select>
</label>
<label>动作目标
    <input name="action_target" value="{{ action.target if action else '' }}" placeholder="App.exe 或 https://…" required>
</label>
<label class="full">程序参数（一行一个）
    <textarea name="action_arguments" rows="3">{{ action.arguments|join('\n') if action else '' }}</textarea>
</label>
{% endmacro %}

{% macro component_draft() %}
<fieldset class="component-draft" data-component-draft>
    <legend>预设卡片</legend>
    <div class="component-draft-grid">
        <label>卡片标题<input name="component_title" maxlength="100" placeholder="例如：打开课表"></label>
        <label>卡片简介<input name="component_description" maxlength="300" placeholder="显示在主页卡片上"></label>
        <label>动作类型
            <select name="component_action_type"><option value="program">运行程序</option><option value="url">打开网址</option></select>
        </label>
        <label>动作目标<input name="component_action_target" placeholder="App.exe 或 https://…"></label>
        <label class="full">程序参数（一行一个）<textarea name="component_action_arguments" rows="2"></textarea></label>
    </div>
    <button class="danger-link component-remove" type="button" data-remove-component>移除这张卡片</button>
</fieldset>
{% endmacro %}
